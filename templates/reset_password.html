<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — ROSP Dealers Social Media</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      background-image:
        radial-gradient(ellipse 80% 80% at 20% 20%, rgba(99,102,241,0.15) 0%, transparent 50%),
        radial-gradient(ellipse 60% 60% at 80% 80%, rgba(168,85,247,0.10) 0%, transparent 50%);
      padding: 20px;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.05) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .brand-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 14px;
      box-shadow: 0 0 40px rgba(99,102,241,0.4);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .brand-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-top: 4px;
    }

    .login-card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 32px 64px rgba(0,0,0,0.6);
    }

    .card-heading {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .card-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 24px;
    }

    .error-banner {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px;
      padding: 12px 16px;
      color: #f87171;
      font-size: 13px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;

    }

    .field-input-wrap {
      position: relative;
    }

    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
      opacity: 0.6;
    }

    .field-input {
      width: 100%;
      height: 48px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 0 16px 0 44px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .field-input:focus {
      border-color: #6366f1;
      background: rgba(99,102,241,0.08);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
    }

    .btn-login {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(99,102,241,0.4);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #6366f1;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">

    <div class="brand-area">
      <div class="brand-logo">🔑</div>
      <div class="brand-title">Reset Account Password</div>
      <div class="brand-sub">ROSP Dealers Social Media Management</div>
    </div>

    <div class="login-card">
      <div class="card-heading">Set New Password</div>
      <div class="card-sub">Enter your username and choose your new password</div>

      {% if error %}
      <div class="error-banner">
        <span>⚠️</span> {{ error }}
      </div>
      {% endif %}

      <form method="POST" id="reset-form">
        <div class="field-group">
          <div>
            <div class="field-label">Username</div>
            <div class="field-input-wrap">
              <span class="field-icon">👤</span>
              <input class="field-input" type="text" name="username" placeholder="Enter username (e.g. admin)" required autofocus>
            </div>
          </div>

          <div>
            <div class="field-label">New Password</div>
            <div class="field-input-wrap">
              <span class="field-icon">🔑</span>
              <input class="field-input" type="password" name="new_password" placeholder="Enter new password" required>
            </div>
          </div>

          <div>
            <div class="field-label">Confirm New Password</div>
            <div class="field-input-wrap">
              <span class="field-icon">🔒</span>
              <input class="field-input" type="password" name="confirm_password" placeholder="Confirm new password" required>
            </div>
          </div>
        </div>

        <button class="btn-login" type="submit" id="reset-btn">
          🔐 Update Password →
        </button>

        <a href="{{ url_for('login') }}" class="back-link">← Back to Sign In</a>
      </form>
    </div>

    <div class="login-footer">Developed by Wasim Javed &nbsp;•&nbsp; ROSP © 2026</div>
  </div>

  <script>
    document.getElementById('reset-form').addEventListener('submit', function() {
      const btn = document.getElementById('reset-btn');
      btn.disabled = true;
      btn.textContent = 'Updating Password…';
    });
  </script>
</body>
</html>
