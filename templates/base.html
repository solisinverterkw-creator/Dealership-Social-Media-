<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){
      var t = localStorage.getItem('theme');
      if(t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>{% block title %}ROSP - Dealers Social Media{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#090e0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ROSP Suzuki">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
  <script src="/assets/progress-timer.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <!-- Mobile Top Navigation Bar (Hidden on Desktop) -->
  <div class="mobile-top-bar" id="mobile-top-bar">
    <button class="mobile-menu-btn" id="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle menu">
      <span class="hamburger-lines">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>
    <div class="mobile-brand">
      <span class="mobile-logo-plate"><img src="/assets/suzuki-logo.png" alt="Suzuki" class="mobile-logo"></span>
      <span class="mobile-brand-title">ROSP Suzuki</span>
    </div>
    <button class="mobile-theme-btn" onclick="cycleTheme()" title="Switch Theme" aria-label="Switch Theme">🎨</button>
  </div>

  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

  <div class="app-layout">
    {% include 'sidebar.html' %}
    <main class="main-content">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
